<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>tAqua Irrigation Control</title>
        <meta name="description" content="tAqua Irrigation Control">
        
        <link rel="stylesheet" href="static/style.css">
        <link rel="stylesheet" href="static/button.css">
        <link rel="stylesheet" href="static/times.css">
        <link rel="stylesheet" href="static/box.css">
        <link rel="stylesheet" href="static/popup.css">
        <link rel="stylesheet" href="static/settings.css">
        <link rel="stylesheet" href="static/scheduled.css">

        <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    </head>
    <body>
        <!--CONTENT-->
        <div class="overlay overlay-hidden"></div>
        <header>
            <div class="headline">
                <img class="tAquaLogo" src="img/logo.svg">
                <div class="tAquaCaption">
                    <div class="name">
                        <span>t</span><span>Aqua</span>
                        <img class="wave" src="img/logo_wave.svg" alt="">
                    </div>

                    <div class="subtitle">
                        Irrigation Control
                    </div>
                </div>
                <div class="tbutton hover-button settings-button-container">
                    <svg class="settings-svg settings-button" xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 35.224 34.866">
                        <path d="M12.268 26.863h2.33c.791 0 1.372-.475 1.553-1.257l.622-2.613a13 13 0 0 0 1.11-.443l2.28 1.412c.663.414 1.43.346 1.974-.206l1.638-1.629c.55-.552.62-1.336.187-2.002l-1.396-2.264c.157-.355.308-.716.423-1.08l2.636-.624c.78-.18 1.237-.761 1.237-1.553V12.31c0-.782-.458-1.359-1.237-1.547l-2.61-.626c-.134-.397-.292-.765-.43-1.087l1.403-2.309c.417-.679.363-1.417-.2-1.976L22.13 3.126c-.559-.507-1.26-.618-1.919-.219l-2.328 1.438a9 9 0 0 0-1.106-.446l-.626-2.645C15.967.474 15.389 0 14.597 0h-2.329c-.795 0-1.37.474-1.557 1.257l-.62 2.623a9 9 0 0 0-1.121.455L6.654 2.907c-.666-.399-1.382-.314-1.922.222L3.074 4.765c-.562.559-.617 1.297-.197 1.976l1.4 2.31c-.138.321-.295.689-.427 1.086l-2.61.626C.469 10.951 0 11.528 0 12.31v2.294c0 .792.468 1.372 1.24 1.553l2.633.623c.118.365.266.726.423 1.08L2.9 20.126c-.43.666-.36 1.45.19 2.002l1.636 1.629c.546.552 1.313.62 1.973.206l2.283-1.412c.348.157.723.311 1.11.443l.62 2.613c.184.782.761 1.257 1.556 1.257m1.163-9.02a4.42 4.42 0 0 1-4.414-4.415 4.42 4.42 0 0 1 4.414-4.414 4.416 4.416 0 0 1 4.414 4.414 4.42 4.42 0 0 1-4.414 4.414"/>
                    </svg>
                </div>
            </div>
        </header>

        <div class="fixed-box-area">
            <div class="fixed-box-wrapper">
                <div class="box-vertical">
                    <div class="box-horizontal">
                        <div class="fixed-box tbutton hover-button border-box scheduled-box">
                            <h1>Scheduled</h1>
                            <div class="box-svg-area">
                                <svg xmlns="http://www.w3.org/2000/svg" height="90%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-clock preview-icon">
                                    <path d="M16 14v2.2l1.6 1"/>
                                    <path d="M16 2v3"/>
                                    <path d="M21 7.338V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h2.338"/>
                                    <path d="M3 9h5.859"/>
                                    <path d="M8 2v3"/>
                                    <circle cx="16" cy="16" r="6"/>
                                </svg>
                            </div>
                        </div>
                        <div class="fixed-box border-box border-box-hover tbutton hover-button border-box quick-control-box">
                            <h1>Quick Control</h1>
                            <div class="box-svg-area">
                                <svg xmlns="http://www.w3.org/2000/svg" height="90%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal preview-icon">
                                    <path d="M10 5H3"/>
                                    <path d="M12 19H3"/>
                                    <path d="M14 3v4"/>
                                    <path d="M16 17v4"/>
                                    <path d="M21 12h-9"/>
                                    <path d="M21 19h-5"/>
                                    <path d="M21 5h-7"/>
                                    <path d="M8 10v4"/>
                                    <path d="M8 12H3"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="fixed-widget border-box tbutton hover-button border-box next-events-widget">
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <div class="bottom-line">
                <div class="bottom-status">
                    <div class="bottom-status-svg">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info preview-icon">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 16v-4"/>
                            <path d="M12 8h.01"/>
                        </svg>
                    </div>
                    <span class="valve-status hidden">1</span>
                    <span class="valve-status hidden">2</span>
                    <span class="valve-status hidden">3</span>
                    <span class="valve-status hidden">4</span>
                    <span class="valve-status hidden">5</span>
                    <span class="valve-status hidden">6</span>
                    <span class="valve-status hidden">7</span>
                    <span class="valve-status hidden">8</span>
                </div>
                <div class="bottom-log tbutton hover-button settings-button-container">
                    <div class="bottom-log-svg">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-logs preview-icon">
                            <path d="M3 5h1"/>
                            <path d="M3 12h1"/>
                            <path d="M3 19h1"/>
                            <path d="M8 5h1"/>
                            <path d="M8 12h1"/>
                            <path d="M8 19h1"/>
                            <path d="M13 5h8"/>
                            <path d="M13 12h8"/>
                            <path d="M13 19h8"/>
                        </svg>
                    </div>
                </div>
            </div>
        </footer>


        <!--POPUP-->
        <div class="tpopup settings-popup popup-hidden">
            <div class="popup-container">
                <div class="tbutton hover-button popup-close-button">
                    <svg class="close-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 20 20">
                        <path d="M0 0 L10 10 M10 0 L0 10" />
                    </svg>
                </div>
                <div class="popup-wrapper">
                    <div class="popup-header">
                        <h2>Settings</h2>
                    </div>
                    <div class="popup-content">
                        <div class="popup-card">
                            <h2>Relay Configuration</h2>
                            
                            <div class="settings-grid">
                                <div class="settings-valve-number">
                                    <h2>1</h2>
                                </div>
                                <div class="settings-valve-number">
                                    <h2>2</h2>
                                </div>
                                <div class="settings-valve-number">
                                    <h2>3</h2>
                                </div>
                                <div class="settings-valve-number">
                                    <h2>4</h2>
                                </div>
                                <div class="settings-valve-number">
                                    <h2>5</h2>
                                </div>
                                <div class="settings-valve-number">
                                    <h2>6</h2>
                                </div>
                                <div class="settings-valve-number">
                                    <h2>7</h2>
                                </div>
                                <div class="settings-valve-number">
                                    <h2>8</h2>
                                </div>
                                <!-------------------------------->
                                <button class="tbutton hover-button settings-valve" data-id="0" data-state="0">
                                    <img class="settings-valve-icon settings-valve-icon-0" src="img/no_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-1" src="img/magnetic_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-2" src="img/permanent_power.svg" />
                                </button>
                                
                                <button class="tbutton hover-button settings-valve" data-id="1" data-state="0">
                                    <img class="settings-valve-icon settings-valve-icon-0" src="img/no_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-1" src="img/magnetic_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-2" src="img/permanent_power.svg" />
                                </button>
                                
                                <button class="tbutton hover-button settings-valve" data-id="2" data-state="0">
                                    <img class="settings-valve-icon settings-valve-icon-0" src="img/no_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-1" src="img/magnetic_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-2" src="img/permanent_power.svg" />
                                </button>
                                
                                <button class="tbutton hover-button settings-valve" data-id="3" data-state="0">
                                    <img class="settings-valve-icon settings-valve-icon-0" src="img/no_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-1" src="img/magnetic_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-2" src="img/permanent_power.svg" />
                                </button>
                                
                                <button class="tbutton hover-button settings-valve" data-id="4" data-state="0">
                                    <img class="settings-valve-icon settings-valve-icon-0" src="img/no_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-1" src="img/magnetic_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-2" src="img/permanent_power.svg" />
                                </button>
                                
                                <button class="tbutton hover-button settings-valve" data-id="5" data-state="0">
                                    <img class="settings-valve-icon settings-valve-icon-0" src="img/no_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-1" src="img/magnetic_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-2" src="img/permanent_power.svg" />
                                </button>
                                
                                <button class="tbutton hover-button settings-valve" data-id="6" data-state="0">
                                    <img class="settings-valve-icon settings-valve-icon-0" src="img/no_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-1" src="img/magnetic_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-2" src="img/permanent_power.svg" />
                                </button>
                                
                                <button class="tbutton hover-button settings-valve" data-id="7" data-state="0">
                                    <img class="settings-valve-icon settings-valve-icon-0" src="img/no_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-1" src="img/magnetic_valve.svg" />
                                    <img class="settings-valve-icon settings-valve-icon-2" src="img/permanent_power.svg" />
                                </button>
                            </div>
                        </div>

                        <div class="popup-card">
                            <h2>Button Irrigation Duration</h2>
                            
                            <div class="duration-picker">
                                <div class="duration-input-group">
                                    <input id="btn-irr-duration-m" type="number" min="0" max="119" placeholder="0" aria-label="Minutes" value="0">
                                    <span>Min</span>
                                </div>
                                
                                <span class="duration-separator">:</span>
                                
                                <div class="duration-input-group">
                                    <input id="btn-irr-duration-s" type="number" min="0" max="59" placeholder="0" aria-label="Seconds" value="0">
                                    <span>Sec</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tpopup scheduled-popup popup-hidden">
            <div class="popup-container">
                <div class="tbutton hover-button popup-close-button">
                    <svg class="close-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 20 20">
                        <path d="M0 0 L10 10 M10 0 L0 10" />
                    </svg>
                </div>
                <div class="popup-wrapper popup-wrapper-scheduled-popup">
                    <div class="popup-header">
                        <h2>Scheduled Events</h2>
                    </div>
                    <div class="popup-content hidden">
                        <div class="popup-card">
                            <h2>Valve 1</h2>
                            <div class="scheduled-plus tbutton hover-button">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-plus preview-icon"><path d="M16 18h6"/><path d="M16 2v3"/><path d="M19 15v6"/><path d="M21 11.5V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h8.3"/><path d="M3 9h18"/><path d="M8 2v3"/></svg>
                            </div>

                            <div class="scheduled-event tbutton">
                                <div class="group">
                                    <svg class="minus" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-minus preview-icon"><path d="M16 18h6"/><path d="M16 2v3"/><path d="M21 14V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h8.3"/><path d="M3 9h18"/><path d="M8 2v3"/></svg>
                                    
                                    <div class="seperator"></div>

                                    <div class="group hover-group">
                                        <span class="weekday-preview">Mon Wed Fri Sun</span>
                                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-days preview-icon"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></svg>
                                    </div>
                                </div>
                                <div class="group hover-group">
                                    <span class="time-preview">05:30</span>
                                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock preview-icon"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                                </div>
                                <div class="group hover-group">
                                    <span class="duration-preview">3m30s</span>
                                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hourglass preview-icon"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="popup-content hidden">
                        <div class="popup-card">
                            <h2>Valve 2</h2>
                        </div>
                    </div>
                    <div class="popup-content hidden">
                        <div class="popup-card">
                            <h2>Valve 3</h2>
                        </div>
                    </div>
                    <div class="popup-content hidden">
                        <div class="popup-card">
                            <h2>Valve 4</h2>
                        </div>
                    </div>
                    <div class="popup-content hidden">
                        <div class="popup-card">
                            <h2>Valve 5</h2>
                        </div>
                    </div>
                    <div class="popup-content hidden">
                        <div class="popup-card">
                            <h2>Valve 6</h2>
                        </div>
                    </div>
                    <div class="popup-content hidden">
                        <div class="popup-card">
                            <h2>Valve 7</h2>
                        </div>
                    </div>
                    <div class="popup-content hidden">
                        <div class="popup-card">
                            <h2>Valve 8</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!--SCRIPT-->
        <script type="text/javascript" src="static/helper.js"></script>
        <script type="text/javascript" src="static/status.js"></script>
        <script type="text/javascript" src="static/script.js"></script>
    </body>
</html>
